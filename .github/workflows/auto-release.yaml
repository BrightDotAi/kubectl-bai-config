name: kubectl-bai-config auto-release

on:
  push:
    paths-ignore:
      - "plugins/bai-config.yaml"
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Get PR from merged commit to the default branch
      - name: Get merged pull request
        id: get-merged-pull-request
        env:
          GH_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[].labels[].name] | join(",")')
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

      # Publish Release
      - uses: release-drafter/release-drafter@v6
        id: release-drafter
        with:
          publish: ${{ !contains(steps.get-merged-pull-request.outputs.labels, 'no-release') }}
          prerelease: false
          config-name: auto-release.yml
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      # The krew manifest GoReleaser just pushed points here; users only see it after
      # `kubectl krew update`, so the few seconds this branch lags behind are invisible.
      - name: Publish plugin archives to the artifacts branch
        env:
          TAG: ${{ steps.release-drafter.outputs.tag_name }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp dist/*.tar.gz "$staging/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "artifacts-${TAG}"
          mkdir -p "artifacts/bai-config/${TAG}"
          cp "$staging"/*.tar.gz "artifacts/bai-config/${TAG}/"
          git add "artifacts/bai-config/${TAG}"
          git commit -m "chore: publish bai-config ${TAG} plugin archives"
          git push origin "artifacts-${TAG}"

      # Deleting the branch makes its blobs unreachable, so archives do not accumulate.
      - name: Prune superseded artifact branches
        env:
          KEEP: 3
        run: |
          set -euo pipefail
          git ls-remote --heads origin 'artifacts-*' \
            | sed 's#.*refs/heads/##' \
            | sort -V \
            | awk -v keep="${KEEP}" '{seen[NR]=$0} END {for (i=1; i<=NR-keep; i++) print seen[i]}' \
            | while read -r stale; do
                echo "pruning ${stale}"
                git push origin --delete "${stale}"
              done
