name: kubectl-bai-config auto-release

on:
  push:
    paths-ignore:
      - "plugins/bai-config.yaml"
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Get PR from merged commit to the default branch
      - name: Get merged pull request
        id: get-merged-pull-request
        env:
          GH_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[].labels[].name] | join(",")')
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

      # Publish Release
      - uses: release-drafter/release-drafter@v7
        id: release-drafter
        with:
          publish: ${{ !contains(steps.get-merged-pull-request.outputs.labels, 'no-release') }}
          prerelease: false
          config-name: auto-release.yml
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}

      # refs/artifacts/* sits outside refs/heads/*, so no clone or `krew update` ever
      # fetches these archives; a dot in the ref name breaks raw's ref/path split.
      - name: Publish plugin archives to refs/artifacts
        env:
          TAG: ${{ steps.release-drafter.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          for archive in dist/*.tar.gz; do
            blob="$(git hash-object -w "${archive}")"
            git update-index --add \
              --cacheinfo "100644,${blob},artifacts/bai-config/${TAG}/$(basename "${archive}")"
          done
          commit="$(git commit-tree "$(git write-tree)" -m "artifacts: bai-config ${TAG}")"
          unset GIT_INDEX_FILE
          # --force so re-running a failed release can repair the ref: these commits are
          # parentless, so a retry never fast-forwards and would be rejected otherwise
          git push --force origin "${commit}:refs/artifacts/${TAG//./-}"
          echo "published refs/artifacts/${TAG//./-}"

      # Gate on the archives actually being fetchable before the index can point at them.
      - name: Verify published archives
        run: |
          set -euo pipefail
          awk '/uri:/{u=$NF} /sha256:/{print u, $NF}' dist/krew/bai-config.yaml \
            | while read -r uri want; do
                got="$(curl -fsSL --retry 3 --retry-delay 5 "${uri}" | sha256sum | cut -d' ' -f1)"
                [ "${got}" = "${want}" ] || { echo "::error::${uri} has ${got}, manifest expects ${want}"; exit 1; }
                echo "ok $(basename "${uri}")"
              done

      # Only now may the index move. main is PR-only under the SOC2 ruleset (no bypass
      # actors), so the manifest lands as a PR rather than a push.
      - name: Open krew manifest PR
        env:
          TAG: ${{ steps.release-drafter.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.PAT_ORG_ADMIN_REPO_ALL }}
        run: |
          set -euo pipefail
          branch="chore/krew-manifest-${TAG}"
          git fetch origin main
          git switch -c "${branch}" origin/main
          cp dist/krew/bai-config.yaml plugins/bai-config.yaml
          git add plugins/bai-config.yaml
          if git diff --cached --quiet; then
            echo "manifest already current on main, nothing to open"
            exit 0
          fi
          git commit -m "chore: update krew manifest for ${TAG}"
          git push --force origin "${branch}"
          if [ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for ${branch}"
          else
            gh pr create --base main --head "${branch}" \
              --title "chore: update krew manifest for ${TAG}" \
              --body "Publishes the krew manifest for ${TAG}. Archives are already live on \`refs/artifacts/${TAG//./-}\` and every checksum was verified before this PR was opened."
          fi

      # Deleting the ref makes its blobs unreachable, so archives do not accumulate.
      - name: Prune superseded artifact refs
        env:
          KEEP: 3
        run: |
          set -euo pipefail
          git ls-remote origin 'refs/artifacts/*' \
            | sed 's#.*refs/artifacts/##' \
            | sort -V \
            | awk -v keep="${KEEP}" '{seen[NR]=$0} END {for (i=1; i<=NR-keep; i++) print seen[i]}' \
            | while read -r stale; do
                echo "pruning refs/artifacts/${stale}"
                git push origin ":refs/artifacts/${stale}"
              done
