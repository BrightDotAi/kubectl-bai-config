version: 2
project_name: kubectl-bai-config
before:
  hooks:
    - go mod download
builds:
  - id: kubectl-bai-config
    main: ./main.go
    binary: kubectl-bai-config
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - ids:
      - kubectl-bai-config
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: "false"
    formats:
      - tar.gz
    files: []

krews:
  - name: bai-config
    repository:
      owner: BrightDotAi
      name: kubectl-bai-config
    # refs/artifacts/* is outside refs/heads/*, so `krew update` never fetches it;
    # the ref name must stay dot-free or raw.githubusercontent.com 404s on ref/path split
    url_template: "https://raw.githubusercontent.com/BrightDotAi/kubectl-bai-config/refs/artifacts/{{ replace .Tag \".\" \"-\" }}/artifacts/bai-config/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://github.com/BrightDotAi/kubectl-bai-config
    short_description: Generate a kubeconfig for access to BrightAI Kubernetes clusters via Okta OIDC
    description: |
      This plugin authenticates to BrightAI Spacelift and reads EKS and OIDC
      stack outputs to generate a valid `kubeconfig` file for authentication
      to BrightAI Kubernetes clusters.
    caveats: |
      * Users must have read access to the `EKS`` and `OKTA-OIDC-EKS-AUTH`
      component outputs in Spacelift.
